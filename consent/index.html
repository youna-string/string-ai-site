<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>String AI — 보호자 동의</title>
<!--
  보호자 동의 확인 페이지 (2026-08-29 신설).

  ■ 왜 여기(GitHub Pages)에 있나
    Supabase Edge 게이트웨이가 함수 응답을 강제로 `content-type: text/plain` +
    `x-content-type-options: nosniff` + `content-security-policy: default-src 'none'; sandbox`
    로 내린다(피싱 호스팅 방지). 함수가 text/html 을 명시해도 덮어쓴다 — 재배포로도 안 바뀜(실측).
    그 결과 부모 화면엔 HTML 소스가 글자로 보였고 sandbox 가 폼 제출까지 막아
    **2026-08-21 이후 부모동의가 구조적으로 불가능**했다(발송 8건 전부 verified 0).
    → 페이지는 진짜 text/html 을 내는 이 도메인이 담당하고, Edge 는 302 + JSON API 만 한다.

  ■ 상태를 바꾸는 건 POST 뿐 (COPPA)
    메일 보안 스캐너(SafeLinks·Mimecast·Gmail 프리페치)가 링크를 자동 GET 한다.
    이 페이지를 여는 것만으로는 아무 일도 일어나지 않는다. 사람이 버튼을 눌러야 POST 가 나간다.

  ■ 문구는 서버가 준다
    ko/en 본문을 Edge 응답(JSON)에서 그대로 받아 쓴다 — 문구가 두 군데로 갈라지지 않게.
-->
<style>
  :root {
    --cream: #faf6ef; --card: #ffffff; --line: #e8e0d0;
    --ink: #2b2b2b; --muted: #666; --gold: #d4af7a; --green: #2e7d32; --red: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }
  .brand { text-align: center; font-size: 15px; letter-spacing: .04em; color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px 26px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  h1 { font-size: 21px; margin: 0 0 14px; font-weight: 700; }
  h2 { font-size: 17px; margin: 0 0 10px; font-weight: 600; }
  p  { font-size: 15px; margin: 0 0 16px; }
  .en { color: var(--muted); font-size: 14px; }
  hr { border: 0; border-top: 1px solid #eee; margin: 26px 0; }
  button {
    font: inherit; font-size: 17px; font-weight: 600; width: 100%;
    padding: 15px 24px; border: 0; border-radius: 12px; color: #fff;
    background: var(--green); cursor: pointer; margin-top: 4px;
  }
  button.danger { background: var(--red); }
  button:disabled { opacity: .55; cursor: default; }
  .icon { font-size: 22px; margin-right: 6px; }
  .muted { color: var(--muted); font-size: 13px; margin: 18px 0 0; }
  .spin { text-align: center; color: var(--muted); padding: 28px 0; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">String AI</p>
  <div class="card" id="card">
    <div class="spin" id="boot">불러오는 중… · Loading…</div>
  </div>
  <p class="muted" id="foot"></p>
</div>

<script>
(function () {
  'use strict';

  var API = 'https://yopimhenbkuniwfsqiyp.supabase.co/functions/v1/verify-parent-consent';
  var q = new URLSearchParams(location.search);
  var token = q.get('token') || '';
  var action = q.get('action') === 'revoke' ? 'revoke' : 'verify';
  var card = document.getElementById('card');
  var foot = document.getElementById('foot');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function url(method) {
    return API + '?token=' + encodeURIComponent(token) +
           '&action=' + encodeURIComponent(action) + '&format=json';
  }

  // 서버가 못 답할 때만 쓰는 최소 문구. 정상 경로의 모든 문구는 서버가 준다.
  var OFFLINE = {
    ok: false,
    titleKo: '연결할 수 없습니다', titleEn: 'Cannot connect',
    bodyKo: '인터넷 연결을 확인하시고 잠시 후 다시 시도해 주세요.',
    bodyEn: 'Please check your connection and try again in a moment.'
  };

  function draw(o, busy) {
    var icon = o.ok ? '✓' : '✗';
    var html =
      '<h1><span class="icon">' + icon + '</span>' + esc(o.titleKo) + '</h1>' +
      '<p>' + esc(o.bodyKo) + '</p>';
    if (o.confirm) {
      html += '<button id="go"' + (busy ? ' disabled' : '') +
              (o.confirm.danger ? ' class="danger"' : '') + '>' +
              (busy ? '처리 중… · Working…'
                    : esc(o.confirm.labelKo) + ' · ' + esc(o.confirm.labelEn)) +
              '</button>';
    }
    html += '<hr><h2>' + icon + ' ' + esc(o.titleEn) + '</h2>' +
            '<p class="en">' + esc(o.bodyEn) + '</p>';
    card.innerHTML = html;

    var go = document.getElementById('go');
    if (go && !busy) go.addEventListener('click', function () { submit(o); });

    foot.textContent = o.confirm
      ? '이 페이지를 여는 것만으로는 아무것도 처리되지 않습니다. 버튼을 누르셔야 완료됩니다. · Opening this page alone changes nothing; the button completes it.'
      : '';
  }

  function submit(prev) {
    draw(prev, true);
    fetch(url(), { method: 'POST', headers: { 'Content-Type': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (o) { draw(o, false); })
      .catch(function () { draw(OFFLINE, false); });
  }

  fetch(url(), { method: 'GET' })
    .then(function (r) { return r.json(); })
    .then(function (o) { draw(o, false); })
    .catch(function () { draw(OFFLINE, false); });
})();
</script>
</body>
</html>
