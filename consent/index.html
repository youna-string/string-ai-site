<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>String AI — 보호자 동의</title>
<!--
  보호자 동의 확인 페이지 (2026-08-29 신설).

  ■ 왜 여기(GitHub Pages)에 있나
    Supabase Edge 게이트웨이가 함수 응답을 강제로 `content-type: text/plain` +
    `x-content-type-options: nosniff` + `content-security-policy: default-src 'none'; sandbox`
    로 내린다(피싱 호스팅 방지). 함수가 text/html 을 명시해도 덮어쓴다 — 재배포로도 안 바뀜(실측).
    그 결과 부모 화면엔 HTML 소스가 글자로 보였고 sandbox 가 폼 제출까지 막아
    2026-08-21 이후 부모동의가 구조적으로 불가능했다(발송 8건 전부 verified 0).
    → 페이지는 진짜 text/html 을 내는 이 도메인이 담당하고, Edge 는 302 + JSON API 만 한다.

  ■ 디자인 = 동의 요청 메일과 같은 토큰 (supabase/functions/_shared/email.ts 의 PALETTE/FONT)
    부모는 그 메일을 보고 이 페이지로 넘어온다. 다른 디자인이 뜨면 피싱처럼 보인다.
    bg #F5F1E3 / card #FFFBF0 / heading #2E2A24 / body #5C5346 / detail #8A7F6E /
    note #A89C88 / gold #D2A964(기본) / danger #B0685C(철회), 카드 radius 16, 버튼 radius 12,
    최대폭 480, 워드마크 "🎻 String AI".
    ⚠️ 색·폰트를 여기서 새로 만들지 말 것 — 바꿔야 하면 email.ts 와 **같이** 바꾼다.
    버튼 라벨만 메일과 다르게 두 줄로 쌓는다(웹은 폭 여유가 있고 한글이 먼저 읽혀야 한다).

  ■ 상태를 바꾸는 건 POST 뿐 (COPPA)
    메일 보안 스캐너(SafeLinks·Mimecast·Gmail 프리페치)가 링크를 자동 GET 한다.
    이 페이지를 여는 것만으로는 아무 일도 일어나지 않는다. 사람이 버튼을 눌러야 POST 가 나간다.

  ■ 문구는 서버가 준다
    ko/en 본문을 Edge 응답(JSON)에서 그대로 받아 쓴다 — 문구가 두 군데로 갈라지지 않게.

  ■ 한 언어만 보여 준다 (2026-09-02)
    메일이 수신자 언어 하나로 가므로 이 페이지도 같은 언어 하나로 그린다. 언어 = 링크의 ?lang=(메일이 실어 옴),
    서버 JSON 의 lang(옛 링크: 학생 프로필 언어)이 있으면 그것. 둘 다 없으면 ko.
-->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #F5F1E3;
    --card: #FFFBF0;
    --heading: #2E2A24;
    --body: #5C5346;
    --detail: #8A7F6E;
    --note: #A89C88;
    --gold: #D2A964;
    --danger: #B0685C;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    font-family: Pretendard, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--body);
    /* 한글은 어절 단위로 끊는다 — keep-all 이 없으면 "누르셔/야" 처럼 단어 중간이 잘린다. */
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 16px 40px; }
  .mark {
    padding: 0 4px 14px;
    font-size: 16px; font-weight: 700; letter-spacing: .3px;
    color: var(--heading);
  }
  .card { background: var(--card); border-radius: 16px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; line-height: 1.4; font-weight: 700; color: var(--heading); }
  .sub { margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: var(--detail); }
  .body { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--body); }
  .body .en { color: var(--body); }
  .btn {
    display: block; width: 100%; margin: 16px 0 4px;
    border: 0; border-radius: 12px; padding: 13px 16px;
    background: var(--gold); color: #FFFFFF;
    font-family: inherit; cursor: pointer; text-align: center;
  }
  .btn.danger { background: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn { font-size: 16px; font-weight: 600; line-height: 1.35; }
  .note { padding: 16px 4px 0; font-size: 12px; line-height: 1.6; color: var(--note); }
  .loading { font-size: 14px; line-height: 1.6; color: var(--detail); text-align: center; padding: 12px 0; }
  label { display:block; margin:16px 0 8px; font-size:14px; line-height:1.6; }
  select { width:100%; padding:12px; font:inherit; border:1px solid var(--detail); border-radius:8px; background:var(--card); }
  .check { display:flex; gap:10px; align-items:flex-start; }
  .check input { flex:none; margin-top:5px; }
  .secondary { background:var(--body); }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">🎻 String AI</div>
  <div class="card" id="card">
    <p class="loading" id="loading">불러오는 중이에요…</p>
  </div>
  <div class="note" id="note"></div>
</div>

<script>
(function () {
  'use strict';

  var API = 'https://yopimhenbkuniwfsqiyp.supabase.co/functions/v1/verify-parent-consent';
  var T = {
    ko: {
      title: 'String AI — 보호자 동의', loading: '불러오는 중이에요…', working: '처리 중이에요…',
      guard: '이 페이지를 여는 것만으로는 아무것도 바뀌지 않아요. 버튼을 눌러야 완료돼요.',
      foot: 'String AI에서 자동으로 보낸 안내예요 · 문의: stringaiapp@gmail.com',
      offTitle: '연결이 잠시 끊겼어요', offBody: '인터넷 연결을 확인한 뒤 이 페이지를 새로고침해 주세요.'
      , country: '자녀가 현재 거주하는 국가', choose: '선택해 주세요', kr: '대한민국', us: '미국',
      countryHelp: '국적이나 앱 언어가 아니라 자녀의 실제 거주 국가를 선택해 주세요. 미국에 거주하면서 한국어를 쓰는 경우에도 미국을 선택해요. 안내 언어와 인증 국가는 별개예요.',
      guardian: '저는 이 자녀의 법정대리인이며, 위에 안내된 성인 확인을 요청합니다.',
      start: 'KWS 보호자 확인 시작', refresh: '인증 결과 확인',
      kwsPrivacy: 'KWS 개인정보 및 AgeGraph 안내',
      pending: '인증 요청을 보냈어요. 보호자 이메일을 확인한 뒤, 여기서 인증 결과 확인을 눌러 주세요. 이전에 인증한 주소라면 바로 결과가 나올 수도 있어요.',
      verified: '성인 확인 결과가 도착했어요. 인증 결과 확인을 눌러 공유 승인 단계로 이동해 주세요.',
      rate_limited: '확인 요청이 많아요. 잠시 뒤 다시 시도해 주세요.',
      unavailable: '지금은 인증 요청을 확인하지 못했어요. 메일이 도착했을 수도 있으니 먼저 확인해 주세요. 공유 승인은 완료되지 않았어요.',
      rejected: '인증 요청을 보내지 못했어요. 잠시 뒤 다시 시도해 주세요.',
      invalid: '입력 내용을 확인해 주세요.', expired: '요청이 만료됐어요. 자녀가 앱에서 새 연결 요청을 보내 주세요.'
    },
    en: {
      title: 'String AI — Parental consent', loading: 'Loading…', working: 'Working…',
      guard: 'Opening this page changes nothing. Pressing the button completes it.',
      foot: 'Automated message from String AI · Questions? stringaiapp@gmail.com',
      offTitle: 'Connection problem', offBody: 'Please check your connection and refresh this page.'
      , country: "Your child's current country of residence", choose: 'Choose a country', kr: 'Republic of Korea', us: 'United States',
      countryHelp: "Choose where your child actually lives, regardless of nationality or app language. For a child living in the United States, select United States even if you use Korean. Language and verification country are separate.",
      guardian: "I am this child's legal guardian and request the adult verification described above.",
      start: 'Start KWS parent verification', refresh: 'Check verification result',
      kwsPrivacy: 'KWS privacy and AgeGraph information',
      pending: 'Verification was requested. Check your email, then select Check verification result here. A previously verified address may return a result right away.',
      verified: 'Adult verification arrived. Select Check verification result to continue to sharing approval.',
      rate_limited: 'There have been too many requests. Please try again later.',
      unavailable: 'We could not confirm this request yet. An email may already have arrived, so check your inbox first. Sharing has not been approved.',
      rejected: 'We could not send the verification request. Please try again later.',
      invalid: 'Please check the information entered.', expired: 'This request expired. Ask your child to send a new connection request in the app.'
    }
  };

  var q = new URLSearchParams(location.search);
  var token = q.get('token') || '';
  // 액션 허용 목록 — 2026-09-02: 선생님 연결 보호자 승인/거절(approve_link/decline_link) 추가. 그 밖의 값은 verify.
  // 2026-10-10: AI 코칭(국외 이전)만 끄기(withdraw_cross_border — 확인 메일 링크, #132).
  var ALLOWED_ACTIONS = ['verify', 'revoke', 'approve_link', 'decline_link', 'withdraw_cross_border'];
  // 동의 확인의 선택 칸(서버 JSON o.choice — AI 코칭 국외 이전). 처음엔 꺼짐. 다시 그려도(처리 중) 고른 값을 지킨다.
  var choiceChecked = false;
  var actionParam = q.get('action') || 'verify';
  var action = ALLOWED_ACTIONS.indexOf(actionParam) >= 0 ? actionParam : 'verify';
  var langParam = q.get('lang');
  var lang = 'ko';
  var card = document.getElementById('card');
  var note = document.getElementById('note');

  function applyLang(l) {
    lang = l === 'en' ? 'en' : 'ko';
    document.documentElement.lang = lang;
    document.title = T[lang].title;
  }
  applyLang(langParam);
  document.getElementById('loading').textContent = T[lang].loading;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // 서버 JSON 의 ko/en 슬롯에서 현재 언어 것을 고른다(없으면 다른 언어로 폴백).
  function pick(o, key) {
    var a = lang === 'en' ? o[key + 'En'] : o[key + 'Ko'];
    var b = lang === 'en' ? o[key + 'Ko'] : o[key + 'En'];
    return a || b || '';
  }

  function url() {
    return API + '?token=' + encodeURIComponent(token) +
           '&action=' + encodeURIComponent(action) + '&format=json' +
           (langParam ? '&lang=' + encodeURIComponent(langParam) : '');
  }

  function offline() {
    return { ok: false, titleKo: T.ko.offTitle, titleEn: T.en.offTitle, bodyKo: T.ko.offBody, bodyEn: T.en.offBody };
  }

  function draw(o, busy) {
    if (o.lang === 'en' || o.lang === 'ko') applyLang(o.lang);
    var html = '<h1>' + esc(pick(o, 'title')) + '</h1>' +
               '<p class="body">' + esc(pick(o, 'body')) + '</p>';
    if (o.choice && o.confirm) {
      html += '<label class="check"><input type="checkbox" id="choice"' + (choiceChecked ? ' checked' : '') + (busy ? ' disabled' : '') + '><span>' +
              esc(pick(o.choice, 'label')) + '</span></label>' +
              '<p class="body">' + esc(pick(o.choice, 'detail')) + '</p>';
    }
    if (o.confirm) {
      html += '<button class="btn' + (o.confirm.danger ? ' danger' : '') + '" id="go"' + (busy ? ' disabled' : '') + '>' +
              esc(busy ? T[lang].working : pick(o.confirm, 'label')) + '</button>';
    }
    if (o.parentVerification) {
      html += '<p class="body"><a href="https://www.kidswebservices.com/privacy-policy" target="_blank" rel="noopener noreferrer">' + esc(T[lang].kwsPrivacy) + '</a></p>' +
        '<label for="country">' + esc(T[lang].country) + '</label><select id="country" aria-describedby="country-help"><option value="">' + esc(T[lang].choose) + '</option><option value="KR">' + esc(T[lang].kr) + '</option><option value="US">' + esc(T[lang].us) + '</option></select>' +
        '<p class="body" id="country-help">' + esc(T[lang].countryHelp) + '</p>' +
        '<label class="check"><input type="checkbox" id="guardian"><span>' + esc(T[lang].guardian) + '</span></label>' +
        '<button class="btn" id="start-verification" disabled>' + esc(T[lang].start) + '</button>' +
        '<button class="btn secondary" id="refresh-verification">' + esc(T[lang].refresh) + '</button>' +
        '<p class="body" id="verification-status" role="status" aria-live="polite"></p>';
    }
    card.innerHTML = html;
    var go = document.getElementById('go');
    if (go && !busy) go.addEventListener('click', function () { submit(o); });
    var choice = document.getElementById('choice');
    if (choice && !busy) choice.addEventListener('change', function () { choiceChecked = choice.checked; });
    if (o.parentVerification) {
      var country = document.getElementById('country');
      var guardian = document.getElementById('guardian');
      var start = document.getElementById('start-verification');
      var refresh = document.getElementById('refresh-verification');
      var status = document.getElementById('verification-status');
      var working = false;
      function updateStart() { start.disabled = working || !country.value || !guardian.checked; }
      country.addEventListener('change', updateStart);
      guardian.addEventListener('change', updateStart);
      start.addEventListener('click', function () {
        if (working || start.disabled) return;
        // 2026-09-13: 인증이 끝나면 KWS 가 /consent/verified/ 로 돌려보낸다(포털 Redirect URL).
        //   그 페이지는 어느 승인인지 모르므로, 같은 브라우저의 localStorage 에 토큰을 잠깐 둔다.
        //   URL·제3자에 토큰을 싣지 않으려는 선택이다 — 실패해도 메일 링크가 그대로 유효하다.
        try { localStorage.setItem('sa_consent_token', token); localStorage.setItem('sa_consent_lang', lang); } catch (e) {}
        working = true; updateStart(); refresh.disabled = true; status.textContent = T[lang].working;
        fetch(API.replace('/verify-parent-consent', '/kws-parent-verification'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, location: country.value, guardian: guardian.checked,
            disclosureVersion: o.parentVerification.disclosureVersion, language: lang })
        }).then(function (r) { return r.json(); }).then(function (result) {
          status.textContent = T[lang][result.code] || T[lang].unavailable;
        }).catch(function () { status.textContent = T[lang].unavailable; }).finally(function () {
          working = false; updateStart(); refresh.disabled = false;
        });
      });
      refresh.addEventListener('click', function () {
        refresh.disabled = true;
        fetch(url(), { method: 'GET' }).then(function (r) { return r.json(); })
          .then(function (result) { draw(result, false); }).catch(function () { draw(offline(), false); });
      });
    }
    note.innerHTML = (o.confirm ? esc(T[lang].guard) + '<br/><br/>' : '') + esc(T[lang].foot);
  }

  function submit(prev) {
    draw(prev, true);
    // 선택 칸을 고른 경우에만 cross_border=yes — 안 실으면 서버는 꺼짐으로 동의한다(#132).
    var target = url() + (prev.choice && choiceChecked ? '&cross_border=yes' : '');
    fetch(target, { method: 'POST', headers: { 'Content-Type': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (o) { draw(o, false); window.scrollTo(0, 0); })
      .catch(function () { draw(offline(), false); });
  }

  fetch(url(), { method: 'GET' })
    .then(function (r) { return r.json(); })
    .then(function (o) { draw(o, false); })
    .catch(function () { draw(offline(), false); });
})();
</script>
</body>
</html>
