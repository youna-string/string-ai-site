<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>String AI</title>
<!--
  비밀번호 재설정 착지 페이지 (2026-09-08 신설).

  ■ 무엇을 고치는가
    옛 메일은 버튼 href 를 `{SUPABASE_URL}/auth/v1/verify?token=…&redirect_to=stringai://…` 로 직접 걸었다.
    그 주소는 **GET 인데 상태를 바꾸는** 엔드포인트다 — 요청이 닿는 순간 1회용 recovery 토큰을 소비한다.
    그래서 둘이 터졌다:
      ① 메일 보안 스캐너(SafeLinks·Mimecast·Gmail 프리페치)가 링크를 자동 GET → **사용자가 누르기도 전에 토큰이 탄다.**
      ② 데스크톱에서 누르면 토큰은 타는데 브라우저가 `stringai://` 를 못 열어 빈 창만 남는다(2026-09-08 사용자 실측).
    같은 뿌리의 사고를 이 앱은 이미 한 번 겪었다 — 2026-08-21 부모동의가 스캐너 자동 GET 때문에
    구조적으로 불가능해져 발송 8건 전부 verified 0 이었다(AGENTS.md "동의 페이지를 자체 도메인으로").

  ■ 어떻게 고치는가
    메일에는 **아무것도 소진하지 않는 이 정적 페이지**만 링크한다. verify 주소는 마크업에 존재하지 않고,
    사람이 버튼을 누른 순간 JS 가 조립한다(`event.isTrusted` 확인). 스캐너는 조립할 수 없다.
    ⚠️ verify 주소를 `<a href>` 로 적지 말 것 — 그 순간 스캐너가 다시 따라가고 이 페이지가 무의미해진다.

  ■ 왜 앱을 안 고쳤나 (2026-09-08 판단)
    `verifyOtp(token_hash)` 로 앱이 직접 소진하는 설계도 검토했지만, 살아 있는 런타임이 셋이라
    (shipped_runtimes.json: 스토어 b25 = 1.0.1 / TestFlight b37 / Play b20) 그 셋은 token_hash 를 모른다.
    반면 이 페이지 하나면 **지금 깔려 있는 모든 버전**에서 ①②가 닫히고 새 빌드도 필요 없다.
    앱이 직접 소진하는 강화는 나중에 해도 이 페이지와 충돌하지 않는다(그때 버튼 하나만 바꾸면 된다).

  ■ 왜 이 도메인인가
    메일 발신자가 `noreply@stringaiapp.com` 이다. 재설정은 피싱 표적 1순위 흐름이라
    **발신 도메인 = 착지 도메인**이 실질 방어다. github.io 로 보내면 그 자체가 의심 신호다.

  ■ ⚠️ 주소를 지우지 말 것
    `history.replaceState` 로 token_hash 를 URL 에서 지우고 싶어지지만 **하면 안 된다** —
    데스크톱 복구 경로가 "이 주소를 폰으로 보내기" 라서, 지우면 그 지시가 자기 파괴적이 된다.

  ■ 디자인 = 재설정 메일과 같은 토큰 (supabase/functions/_shared/email.ts 의 PALETTE/FONT)
    사용자는 그 메일을 보고 여기로 넘어온다. 다른 디자인이 뜨면 피싱처럼 보인다.
    색을 여기서 새로 만들지 말 것 — 바꿔야 하면 email.ts 와 같이 바꾼다.

  ■ 언어는 하나만 (메일이 수신자 언어 하나로 가므로)
    링크의 ?lang= 을 따르고, 없으면 브라우저 언어, 그것도 없으면 ko.
-->
<style>
  :root {
    --bg: #F5F1E3; --card: #FFFBF0; --heading: #2E2A24; --body: #5C5346;
    --detail: #8A7F6E; --note: #A89C88; --gold: #D2A964;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--body);
    word-break: keep-all; overflow-wrap: break-word; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 16px 40px; }
  .mark { padding: 0 4px 14px; font-size: 16px; font-weight: 700; letter-spacing: .3px; color: var(--heading); }
  .card { background: var(--card); border-radius: 16px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; line-height: 1.4; font-weight: 700; color: var(--heading); }
  .sub { margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: var(--detail); }
  .body { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--body); }
  .btn {
    display: block; width: 100%; margin: 16px 0 4px; border: 0; border-radius: 12px;
    padding: 13px 16px; background: var(--gold); color: #FFFFFF;
    font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.35;
    cursor: pointer; text-align: center;
  }
  .urlbox {
    margin: 14px 0 4px; padding: 12px; border-radius: 10px; background: #F0EADA;
    font-size: 12px; line-height: 1.5; color: var(--body);
    word-break: break-all; user-select: all; -webkit-user-select: all;
  }
  .copy {
    display: block; width: 100%; margin: 8px 0 0; border: 1px solid var(--detail);
    border-radius: 10px; padding: 10px; background: transparent; color: var(--body);
    font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .note { padding: 16px 4px 0; font-size: 12px; line-height: 1.6; color: var(--note); }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">🎻 String AI</div>
  <div class="card" id="card"></div>
  <p class="note" id="note"></p>
</div>
<script>
(function () {
  'use strict';

  // 공개 값(앱 번들에도 들어 있다). ⚠️ 프로젝트를 옮기면 여기와 앱 .env 를 같이 바꾼다.
  var SUPABASE_URL = 'https://yopimhenbkuniwfsqiyp.supabase.co';
  var APP_LINK = 'stringai://reset-password';

  var T = {
    ko: {
      title: '비밀번호 재설정',
      subMobile: '아래 버튼을 누르면 String AI 앱이 열려요.',
      open: '앱에서 비밀번호 바꾸기',
      subDesktop: '앱이 설치되어 있는 기기에서 열어 주세요',
      bodyDesktop: 'String AI 앱이 설치되어 있는 기기에서 이 주소를 열면 비밀번호를 바꿀 수 있어요. 아래 주소를 복사해 그 기기로 보내 주세요.',
      copy: '주소 복사',
      copied: '복사했어요',
      bad: '링크가 올바르지 않아요',
      badBody: '주소가 잘린 것 같아요. 메일에 있는 버튼을 다시 눌러 주세요.',
      note: '이 링크는 한 번만 쓸 수 있고 한 시간이 지나면 만료돼요. 비밀번호를 바꾸려 한 적이 없다면 이 메일은 무시하셔도 괜찮아요.'
    },
    en: {
      title: 'Reset your password',
      subMobile: 'Tap the button below to open String AI.',
      open: 'Change password in the app',
      subDesktop: 'Open this on the device with the app',
      bodyDesktop: 'Open this address on the device where String AI is installed. Copy it below and send it to that device.',
      copy: 'Copy address',
      copied: 'Copied',
      bad: 'This link is not valid',
      badBody: 'The address looks incomplete. Please tap the button in your email again.',
      note: 'This link works once and expires after an hour. If you did not ask to change your password, you can ignore that email.'
    }
  };

  var q = new URLSearchParams(location.search);
  var lang = q.get('lang') === 'en' ? 'en' : q.get('lang') === 'ko' ? 'ko'
    : (navigator.language || '').slice(0, 2) === 'en' ? 'en' : 'ko';
  var t = T[lang];
  document.documentElement.lang = lang;
  document.title = 'String AI — ' + t.title;

  var tokenHash = q.get('token_hash') || '';
  var type = q.get('type') || 'recovery';
  var card = document.getElementById('card');
  var note = document.getElementById('note');
  note.textContent = t.note;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  // 토큰이 없으면 아무것도 제안하지 않는다 — 추측해서 엉뚱한 주소를 만들지 X.
  if (!/^[A-Za-z0-9_-]{6,512}$/.test(tokenHash) || type !== 'recovery') {
    card.appendChild(el('h1', null, t.bad));
    card.appendChild(el('p', 'body', t.badBody));
    return;
  }

  // 데스크톱은 커스텀 스킴을 못 연다. 여기서 verify 를 부르면 토큰만 타고 빈 창이 남는다(원 증상).
  //   그래서 데스크톱에는 **여는 수단을 아예 주지 않고** 주소를 넘길 방법만 준다.
  //   판정은 화면 폭이 아니라 플랫폼 문자열로 한다 — 좁은 창의 데스크톱을 모바일로 오판하지 않게.
  var ua = navigator.userAgent || '';
  var isMobile = /Android|iPhone|iPad|iPod/i.test(ua)
    || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS 는 데스크톱 UA 를 보낸다

  if (!isMobile) {
    card.appendChild(el('h1', null, t.subDesktop));
    card.appendChild(el('p', 'body', t.bodyDesktop));
    var box = el('div', 'urlbox', location.href);
    card.appendChild(box);
    var copy = el('button', 'copy', t.copy);
    copy.addEventListener('click', function (e) {
      if (!e.isTrusted) return;
      var done = function () { copy.textContent = t.copied; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(location.href).then(done, function () {});
      } else {
        var r = document.createRange();
        r.selectNodeContents(box);
        var s = window.getSelection();
        s.removeAllRanges(); s.addRange(r);
        try { document.execCommand('copy'); done(); } catch (err) {}
      }
    });
    card.appendChild(copy);
    return;
  }

  card.appendChild(el('h1', null, t.title));
  card.appendChild(el('p', 'sub', t.subMobile));
  var btn = el('button', 'btn', t.open);
  btn.addEventListener('click', function (e) {
    // ⚠️ 사람이 진짜로 누른 것만 통과시킨다. 이 주소는 여기서 처음 존재하게 되므로
    //    메일 스캐너·프리페치는 절대 도달할 수 없다(그게 이 페이지의 존재 이유다).
    if (!e.isTrusted) return;
    btn.disabled = true;
    location.href = SUPABASE_URL + '/auth/v1/verify'
      + '?token=' + encodeURIComponent(tokenHash)
      + '&type=recovery'
      + '&redirect_to=' + encodeURIComponent(APP_LINK);
  });
  card.appendChild(btn);
})();
</script>
</body>
</html>
